name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t app .
      - run: docker run --rm app --help
      # End to end in the container: clean data passes, dirty data must fail the gate.
      - run: |
          mkdir -p data && chmod 777 data
          docker run --rm -v "$PWD/data:/data" --entrypoint shopflow-datagen app --scale 0.1 --out /data/clean
          docker run --rm -v "$PWD/data:/data" --entrypoint shopflow-datagen app --scale 0.1 --out /data/dirty --dirty
          docker run --rm -v "$PWD/data:/data" app check /data/clean --rules rules/shopflow.yml --quiet
          if docker run --rm -v "$PWD/data:/data" app check /data/dirty --rules rules/shopflow.yml --quiet; then
            echo "dirty data should have failed the gate" && exit 1
          fi
          docker run --rm -v "$PWD/data:/data" app evaluate /data/dirty --rules rules/shopflow.yml
