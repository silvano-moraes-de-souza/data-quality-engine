[project]
name = "data-quality-engine"
version = "0.1.0"
description = "Declarative data checks with a quality score, validated against injected ground truth"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Silvano Moraes de Souza" }]
requires-python = ">=3.11"
dependencies = [
    "polars>=1.0",
    "pyyaml>=6.0",
    "shopflow-datagen",
]

[project.scripts]
dq-engine = "data_quality_engine.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "psutil>=6.0",
    "matplotlib>=3.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_quality_engine"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PL"]
ignore = ["PLR0913", "PLR2004"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --cov=data_quality_engine --cov-report=term-missing"

[tool.uv.sources]
shopflow-datagen = { git = "https://github.com/silvano-moraes-de-souza/shopflow-datagen" }
